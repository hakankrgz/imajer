name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.5
          cache: true
      - run: go test -race ./...
      - run: go test -run=^$ -fuzz=FuzzDecodeFrame -fuzztime=5s ./internal/protocol
      - run: go test -run=^$ -bench=BenchmarkStreamingMerkleTwoTiBLogicalImage -benchtime=1x -benchmem ./internal/evidence
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - run: govulncheck ./...
      - run: make reproducible
      - run: make cross
      - uses: actions/upload-artifact@v4
        with:
          name: imajer-cross-platform
          path: dist/
