name: desktop-packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Paket sürümü
        required: true
        default: 0.6.8

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-15
    env:
      PACKAGE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: 1.26.5
          cache: true
          cache-dependency-path: go.sum
      - name: Sürümü hazırla
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          case "$VERSION" in
            *[!0-9A-Za-z.-]*|"")
              echo "Geçersiz paket sürümü: $VERSION" >&2
              exit 1
              ;;
          esac
          echo "VERSION=$VERSION" >>"$GITHUB_ENV"
      - name: Tool release anahtarını hazırla
        env:
          TOOL_RELEASE_PRIVATE_PEM: ${{ secrets.TOOL_RELEASE_PRIVATE_PEM }}
        run: |
          if [ -z "$TOOL_RELEASE_PRIVATE_PEM" ]; then
            echo "Repository secret TOOL_RELEASE_PRIVATE_PEM tanımlı değil." >&2
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/imajer-release-keys"
          printf '%s\n' "$TOOL_RELEASE_PRIVATE_PEM" >"$RUNNER_TEMP/imajer-release-keys/tool-release-private.pem"
          chmod 600 "$RUNNER_TEMP/imajer-release-keys/tool-release-private.pem"
      - name: Test
        run: go test ./...
      - name: Masaüstü paketlerini üret
        env:
          IMAJER_RELEASE_KEY_DIR: ${{ runner.temp }}/imajer-release-keys
          VERSION: ${{ inputs.version }}
        run: make desktop-packages VERSION="$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: IMAJER-desktop-${{ github.event.inputs.version || github.ref_name }}
          path: |
            dist/packages/*.zip
            dist/packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: GitHub Release yayımla
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/packages/*.zip dist/packages/SHA256SUMS \
            --verify-tag --generate-notes --title "IMAJER $VERSION"
